# Darmowy plan Supabase usypia projekt po ok. tygodniu bez ruchu – sklep przestaje wtedy działać.
# Ten zadanie co 3 dni wysyła jedno małe zapytanie (odczyt katalogu, jak gość), żeby baza nie zasnęła.
# Klucz poniżej to publiczny klucz „publishable”, ten sam co w index.html – nie daje dostępu do danych klientów.
name: Budzenie bazy Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'   # co 3 dni, ok. 7:17 czasu polskiego
  workflow_dispatch: {}       # można też uruchomić ręcznie w zakładce Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zapytanie do bazy
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H 'apikey: sb_publishable_q97XnrH4dkf1DHY29tgmbQ_zLAXPxB3' \
            'https://xjjavcaushrmfzmknvtv.supabase.co/rest/v1/docs?select=id&col=eq.products&limit=1')
          echo "Odpowiedź bazy: $code"
          test "$code" = "200"
