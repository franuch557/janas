CL.push=()=>{if(CL.anon){ls.set('janas-gcart',JSON.stringify((db.carts||{}).guest||[]));return}CCOL.forEach(c=>{const cur=new Map(db[c].map(x=>[x.id,x])),rem=CL.rem[c],bm=CL.bmap[c];

  [...rem].forEach(([id,j])=>{if(!cur.has(id)){if(bm.has(id)){if(!JSON.parse(j)._del)cwrite(c,id,'set',{_del:true})}else cwrite(c,id,'del')}});

   sb.from('docs').select('id,data').eq('col',c).then(({data,error})=>{if(error){err(error);return}data.forEach(r=>sub.m.set(r.id,r.data));sub.emit()},err)},
  doc(id){return{
   set:d=>sb.from('docs').upsert({col:c,id,data:d,updated_at:new Date().toISOString()}).then(r=>{if(r.error)throw r.error}),
   delete:()=>sb.from('docs').delete().eq('col',c).eq('id',id).then(r=>{if(r.error)throw r.error})}}}}}}
function loadSupa(){return new Promise((res,rej)=>{if(window.supabase)return res();const sc=document.createElement('script');
 sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
async function supaEnter(email,name){
 if(!CL.on)await startCloud(supaDb(SB));
 const e=email.toLowerCase();me=db.users.find(u=>(u.login||'').toLowerCase()===e)||null;
 if(!me){me={id:'u'+Date.now().toString(36),login:email,pass:'',name:name||email.split('@')[0],role:SUPA.owner&&e===SUPA.owner.toLowerCase()?'szef':'klient'};db.users.push(me);save();
  NEWU=me.role==='klient';toast(me.role==='szef'?'Konto szefa utworzone':'Witamy! Twoje konto klienta jest gotowe')}
 ls.set(SK,me.id);view='';detail=null;
 let gc=[];try{gc=JSON.parse(ls.get('janas-gcart')||'[]')}catch(e){}if(gc.length&&me.role==='klient'){db.carts[me.id]=(db.carts[me.id]||[]).concat(gc);save();view='koszyk';toast('Twój koszyk czeka – możesz złożyć zamówienie')}ls.del('janas-gcart');
 render();if(NEWU){NEWU=false;setTimeout(()=>A.profile(),400)}}
async function supaLogin(l,p){const{data,error}=await SB.auth.signInWithPassword({email:l,password:p});
 if(error){toast(/confirm/i.test(error.message)?'Potwierdź adres e-mail – link wysłaliśmy w wiadomości':'Nieprawidłowy e-mail lub hasło',1);return}
 if(CL.anon){location.reload();return}await supaEnter(data.user.email)}
async function supaSignup(){const f=$('#lf');const l=f.l.value.trim(),p=f.p.value;
 if(!/^\S+@\S+\.\S+$/.test(l)){toast('Wpisz adres e-mail',1);return}if(p.length<8){toast('Hasło musi mieć co najmniej 8 znaków',1);return}
 const{data,error}=await SB.auth.signUp({email:l,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(error){toast('Nie udało się założyć konta: '+error.message,1);return}
 if(!data.session){toast('Sprawdź skrzynkę e-mail i kliknij link, aby aktywować konto');return}
 if(CL.anon){location.reload();return}await supaEnter(data.user.email)}

/* ---------- zdjęcia produktów z telefonu ---------- */
function shrinkImg(file,max=1400,q=.85){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/jpeg',q)}):rej(new Error('Nie udało się przetworzyć zdjęcia')),'image/jpeg',q)};
 im.onerror=()=>rej(new Error('To nie jest zdjęcie'));im.src=u})}
document.addEventListener('change',async e=>{if(e.target.id!=='phf'||!e.target.files||!e.target.files[0])return;
 const st=$('#phs'),pv=$('#php'),hv=$('#phv'),sb=document.querySelector('.mod button:not([type=button])');
 try{if(st)st.textContent='Przygotowuję zdjęcie…';if(sb)sb.disabled=true;
  const{blob,url}=await shrinkImg(e.target.files[0]);if(pv)pv.innerHTML=`<img src="${url}" alt="">`;
  if(SB&&!CL.anon){if(st)st.textContent='Wysyłam…';const path='p/'+uid()+'.jpg';
   const{error}=await SB.storage.from('produkty').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
   if(error)throw new Error(/bucket|not found/i.test(error.message)?'Brak miejsca na zdjęcia w bazie – uruchom skrypt supabase-zdjecia.sql':error.message);
   hv.value=SB.storage.from('produkty').getPublicUrl(path).data.publicUrl}
  else hv.value=url;
  if(st)st.textContent='Gotowe – kliknij Zapisz'}
 catch(x){if(st)st.textContent='';toast(x.message||'Błąd zdjęcia',1)}
 finally{if(sb)sb.disabled=false;e.target.value=''}});
/* ---------- tryb jasny / ciemny ---------- */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=isDark()?'#0a4a0e':'#068d0c'}
applyTheme(ls.get('janas-theme'));
const themeBtn=(c='btn sec cartb')=>`<button type="button" class="${c}" data-a="theme" aria-label="${isDark()?'Włącz tryb jasny':'Włącz tryb ciemny'}" title="${isDark()?'Tryb jasny':'Tryb ciemny'}">${isDark()?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'}</button>`;
async function boot(){let c=null;
 try{for(let i=0;i<15&&window.parent!==window&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(window.claude&&window.claude.use)c=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),8000))])}catch(e){c=null}
 if(c){try{await startCloud(c)}catch(e){CL.on=false}}
 else if(SUPA.url&&SUPA.key){try{await loadSupa();SB=window.supabase.createClient(SUPA.url,SUPA.key);ls.del(SK);me=null;
  SB.auth.onAuthStateChange(ev=>{if(ev!=='PASSWORD_RECOVERY')return;setTimeout(()=>modal('Ustaw nowe hasło',fld('Nowe hasło (min. 8 znaków)','pw','','type=password minlength=8 required'),['Zapisz'],v=>{SB.auth.updateUser({password:v.pw}).then(({error})=>toast(error?'Błąd: '+error.message:'Hasło zmienione',!!error))}),300)});
  const{data}=await SB.auth.getSession();if(data.session){await supaEnter(data.session.user.email);return}
  try{await startCloud(supaDb(SB))}catch(e){}CL.anon=true;CL.ro=true;me=GUEST();try{db.carts.guest=JSON.parse(ls.get('janas-gcart')||'[]')}catch(e){db.carts.guest=[]}view='katalog';render();return}catch(e){SB=null;toast('Brak połączenia ze wspólną bazą – tryb lokalny',1)}}
 render()}
$('#app').innerHTML='<div class="login"><p class="mu">Ładowanie…</p></div>';boot();
</script>
